name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Ping health check
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-all-errors --retry-delay 10 "${APP_URL%/}/up"
